# Host-based route through the cluster's Traefik. This is the way in that people
# should be given; the NodePort still works and is the fallback when DNS does
# not (`shkills.biyou.internal` is an alias of `k3s.biyou.internal`).
#
# A named host is required: the neighbouring kidstube Ingress claims host `*`,
# and a specific host wins over it without disturbing that route.
#
#   curl http://shkills.biyou.internal/api/health
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shkills
  namespace: shkills
spec:
  ingressClassName: traefik
  rules:
    - host: shkills.biyou.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shkills
                port:
                  name: http
