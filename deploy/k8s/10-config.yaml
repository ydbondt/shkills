# Non-secret configuration. Secrets live in the `shkills-secrets` Secret, which
# is created out-of-band and is deliberately not in this repo — see README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shkills-config
  namespace: shkills
data:
  # The canonical address of the portal.
  #
  # It is the *fallback*, not the whole answer: /install.sh, the install command
  # the portal shows and the device-link URL all name back the address the
  # caller actually reached, so the NodePort still hands out a working NodePort
  # URL. This one is what gets used when the request cannot say — and it is the
  # address to prefer when both work.
  SHKILLS_PUBLIC_URL: 'http://shkills.biyou.internal'

  # Traefik sits in front, so X-Forwarded-Proto is trustworthy here and is how
  # the app will notice the day this gets TLS. Without a proxy it would be a
  # header anyone could send.
  SHKILLS_TRUST_PROXY: 'true'
